<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="房态管理">
<meta name="theme-color" content="#09090f">
<title>平措康桑 · 房态管理</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  body{background:#09090f;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;color:#fff;overscroll-behavior:none}
  input,textarea,button{font-family:inherit}
  ::-webkit-scrollbar{display:none}
  input::placeholder,textarea::placeholder{color:rgba(255,255,255,0.25)}
</style>
</head>
<body>
<div id="app"></div>

<!-- MQTT.js via jsdelivr (国内可用) -->
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.3.4/dist/mqtt.min.js"></script>
<!-- React -->
<script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.2/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useCallback, useMemo, useRef } = React;

// ─── MQTT 配置（EMQX 杭州公司，国内服务器，无需注册）────────────
const MQTT_URL   = "wss://broker.hivemq.com:8884/mqtt";
const MQTT_TOPIC = "pktk_kangsar_2024/roomstate"; // 唯一主题，只有你们的设备用
const CLIENT_ID  = "pktk_" + Math.random().toString(36).substr(2,8);

// ─── Room data ────────────────────────────────────────────────────
const ROOM_CATEGORIES = [
  { key:"premium_king", label:"甄选院景大床房", short:"院景大床", grid:false,
    rooms:["A201","A202","A203","A209","A210","A211","A301","A302","A303","A309","A310","A311","A401","A402","A403","A409","A410","A411"] },
  { key:"king_18", label:"滚来滚去大床房1.8M", short:"1.8M大床", grid:false,
    rooms:["A215","A216","A315","A316","A413"] },
  { key:"twin", label:"互不打扰双床房", short:"双床房", grid:true,
    rooms:["A206-1","A206-2","A207-1","A207-2","A213-1","A213-2","A306-1","A306-2","A307-1","A307-2","A313-1","A313-2"] },
  { key:"triple", label:"三人间", short:"三人间", grid:true,
    rooms:["A205-1","A205-2","A205-3","A208-1","A208-2","A208-3","A212-1","A212-2","A212-3","A217-1","A217-2","A217-3",
           "A305-1","A305-2","A305-3","A308-1","A308-2","A308-3","A312-1","A312-2","A312-3","A317-1","A317-2","A317-3",
           "A405-1","A405-2","A405-3","A408-1","A408-2","A408-3","A415-1","A415-2","A415-3"] },
  { key:"quad", label:"四人间", short:"四人间", grid:true,
    rooms:["B202-1","B202-2","B202-3","B202-4","B203-1","B203-2","B203-3","B203-4","B205-1","B205-2","B205-3","B205-4",
           "B302-1","B302-2","B302-3","B302-4","B303-1","B303-2","B303-3","B303-4","B305-1","B305-2","B305-3","B305-4",
           "B402-1","B402-2","B402-3","B402-4","B403-1","B403-2","B403-3","B403-4","B405-1","B405-2","B405-3","B405-4"] },
  { key:"five", label:"五人间", short:"五人间", grid:true,
    rooms:["B201-1","B201-2","B201-3","B201-4","B201-5","B301-1","B301-2","B301-3","B301-4","B301-5",
           "B401-1","B401-2","B401-3","B401-4","B401-5","A412-1","A412-2","A412-3","A412-4","A412-5"] },
];
const ALL_ROOMS = ROOM_CATEGORIES.flatMap(c => c.rooms);

// ─── 7种房态 ──────────────────────────────────────────────────────
const STATUS = {
  inhouse:     { label:"在住",   icon:"▣", card:"#0a1f3a", border:"#1055a0", text:"#60b0ff", pill:"#0a2d60", desc:"住客正常在住，请勿打扫" },
  extended:    { label:"续住",   icon:"♟", card:"#0a2a1e", border:"#0f6040", text:"#40e0a0", pill:"#0a4030", desc:"住客续住延期，请勿打扫" },
  vacant:      { label:"空房",   icon:"○", card:"#141420", border:"#3a3a60", text:"#9090c8", pill:"#252540", desc:"无住客，可安排入住"     },
  dirty:       { label:"脏房",   icon:"●", card:"#3a0d0d", border:"#a02020", text:"#ff8080", pill:"#7a1515", desc:"住客已退，需要打扫"     },
  cleaning:    { label:"打扫中", icon:"↻", card:"#3a2e00", border:"#b8900a", text:"#ffd94d", pill:"#7a5e00", desc:"正在打扫中"             },
  clean:       { label:"净房",   icon:"✓", card:"#0c3320", border:"#1a6640", text:"#4fffb0", pill:"#1a5535", desc:"已打扫，可安排入住"     },
  maintenance: { label:"维修",   icon:"✕", card:"#1a1a2e", border:"#4a4a80", text:"#9090c0", pill:"#2e2e50", desc:"维修中，暂停使用"       },
};
const CYCLE      = ["inhouse","extended","dirty","cleaning","clean","vacant","maintenance"];
const PICK_ORDER = ["inhouse","extended","vacant","dirty","cleaning","clean","maintenance"];

const nowMs   = () => Date.now();
const fmtTime = ts => { if(!ts) return ""; const d=new Date(ts); return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };
const elapsed = ts => {
  if(!ts) return null;
  const m=Math.floor((Date.now()-ts)/60000);
  if(m<1) return "刚才"; if(m<60) return `${m}分钟前`;
  const h=Math.floor(m/60),rm=m%60; return rm>0?`${h}小时${rm}分`:`${h}小时`;
};
const isUrgent = s => s && s.status==="dirty" && s.updatedAt && (Date.now()-s.updatedAt)>3600000;

const LS_KEY = "pktk_rooms_v3";
function loadLocal(){
  try{ const v=localStorage.getItem(LS_KEY); if(v) return JSON.parse(v); }catch{}
  const s={};
  ALL_ROOMS.forEach(r=>s[r]={status:"vacant",updatedAt:null,guest:"",note:"",cardReturned:true});
  return s;
}
function saveLocal(s){ try{localStorage.setItem(LS_KEY,JSON.stringify(s));}catch{} }

// ─── Grid card ────────────────────────────────────────────────────
function GridCard({id,state,onCycle,onPress}){
  const s=STATUS[state.status]||STATUS.vacant, urg=isUrgent(state);
  return (
    <div onClick={()=>onPress(id)} style={{background:s.card,border:`1.5px solid ${urg?"#ff4400":s.border}`,borderRadius:9,padding:"7px 6px",cursor:"pointer",minHeight:62,display:"flex",flexDirection:"column",justifyContent:"space-between",position:"relative",overflow:"hidden",boxShadow:urg?"0 0 8px rgba(255,68,0,0.35)":"none"}}>
      {urg&&<div style={{position:"absolute",top:0,right:0,width:0,height:0,borderStyle:"solid",borderWidth:"0 14px 14px 0",borderColor:"transparent #ff4400 transparent transparent"}}/>}
      {!state.cardReturned&&<div style={{position:"absolute",top:2,left:2,width:6,height:6,borderRadius:"50%",background:"#00bfff"}}/>}
      <div style={{fontSize:10,fontWeight:800,color:s.text,fontFamily:"monospace",lineHeight:1.2}}>{id}</div>
      {state.guest?<div style={{fontSize:8,color:s.text,opacity:0.65,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{state.guest}</div>:null}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div style={{fontSize:9,color:s.text,background:s.pill,borderRadius:4,padding:"1px 4px",fontWeight:700}}>{s.icon} {s.label}</div>
        <button onClick={e=>{e.stopPropagation();onCycle(id);}} style={{background:"rgba(255,255,255,0.07)",border:"none",borderRadius:4,width:18,height:18,color:s.text,fontSize:11,cursor:"pointer",padding:0,display:"flex",alignItems:"center",justifyContent:"center"}}>↻</button>
      </div>
    </div>
  );
}

// ─── Row card ─────────────────────────────────────────────────────
function RowCard({id,state,onCycle,onPress}){
  const s=STATUS[state.status]||STATUS.vacant, urg=isUrgent(state);
  return (
    <div onClick={()=>onPress(id)} style={{background:s.card,border:`1.5px solid ${urg?"#ff4400":s.border}`,borderRadius:12,padding:"10px 14px",cursor:"pointer",display:"flex",alignItems:"center",gap:10,position:"relative",overflow:"hidden",boxShadow:urg?"0 0 10px rgba(255,68,0,0.25)":"none"}}>
      <div style={{position:"absolute",left:0,top:0,bottom:0,width:3,background:urg?"#ff4400":s.border}}/>
      {!state.cardReturned&&<div style={{position:"absolute",top:6,right:46,width:7,height:7,borderRadius:"50%",background:"#00bfff"}}/>}
      <div style={{minWidth:54}}>
        <div style={{fontSize:16,fontWeight:800,color:s.text,fontFamily:"monospace"}}>{id}</div>
        {state.guest?<div style={{fontSize:10,color:s.text,opacity:0.55,marginTop:1,maxWidth:50,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{state.guest}</div>:null}
      </div>
      <div style={{flex:1,display:"flex",flexDirection:"column",gap:3}}>
        <div style={{display:"flex",alignItems:"center",gap:6}}>
          <div style={{background:s.pill,color:s.text,padding:"3px 9px",borderRadius:14,fontSize:12,fontWeight:700}}>{s.icon} {s.label}</div>
          {urg&&<div style={{fontSize:10,color:"#ff6622",fontWeight:700}}>⚠ {elapsed(state.updatedAt)}</div>}
          {!urg&&state.updatedAt&&<div style={{fontSize:10,color:s.text,opacity:0.35}}>{fmtTime(state.updatedAt)}</div>}
        </div>
        {state.note?<div style={{fontSize:10,color:s.text,opacity:0.45,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>📝 {state.note}</div>:null}
      </div>
      <button onClick={e=>{e.stopPropagation();onCycle(id);}} style={{background:"rgba(255,255,255,0.07)",border:"none",borderRadius:8,width:32,height:32,color:s.text,fontSize:16,cursor:"pointer",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>↻</button>
    </div>
  );
}

// ─── Detail modal ─────────────────────────────────────────────────
function DetailModal({id,state,onClose,onSave}){
  const [editStatus,setEditStatus]=useState(state.status||"inhouse");
  const [guest,setGuest]=useState(state.guest||"");
  const [note,setNote]=useState(state.note||"");
  const [card,setCard]=useState(state.cardReturned!==false);
  const s=STATUS[editStatus]||STATUS.vacant;
  const doSave=()=>onSave(id,{status:editStatus,guest,note,cardReturned:card,updatedAt:editStatus!==state.status?nowMs():state.updatedAt});
  if(!id) return null;
  return (
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.78)",backdropFilter:"blur(10px)",WebkitBackdropFilter:"blur(10px)",zIndex:200,display:"flex",alignItems:"flex-end"}}>
      <div onClick={e=>e.stopPropagation()} style={{width:"100%",maxWidth:480,margin:"0 auto",background:"#111118",borderRadius:"22px 22px 0 0",padding:"18px 18px 48px",border:"1px solid rgba(255,255,255,0.07)",maxHeight:"94vh",overflowY:"auto"}}>
        <div style={{width:36,height:4,background:"rgba(255,255,255,0.12)",borderRadius:2,margin:"0 auto 16px"}}/>
        <div style={{display:"flex",alignItems:"baseline",justifyContent:"space-between",marginBottom:16}}>
          <div style={{fontSize:26,fontWeight:900,color:s.text,fontFamily:"monospace"}}>{id}</div>
          {state.updatedAt&&<div style={{fontSize:11,color:"rgba(255,255,255,0.25)"}}>{elapsed(state.updatedAt)} · {fmtTime(state.updatedAt)}</div>}
        </div>
        <div style={{fontSize:11,fontWeight:700,color:"rgba(255,255,255,0.35)",marginBottom:8,letterSpacing:0.5}}>房态</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7,marginBottom:16}}>
          {PICK_ORDER.map(k=>{
            const c=STATUS[k],active=k===editStatus;
            return (
              <button key={k} onClick={()=>setEditStatus(k)} style={{background:active?c.card:"rgba(255,255,255,0.03)",border:active?`1.5px solid ${c.border}`:"1.5px solid rgba(255,255,255,0.07)",borderRadius:12,padding:"11px 12px",cursor:"pointer",display:"flex",alignItems:"center",gap:9,textAlign:"left"}}>
                <div style={{width:32,height:32,borderRadius:9,background:active?c.pill:"rgba(255,255,255,0.05)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,color:active?c.text:"rgba(255,255,255,0.2)",fontWeight:800,flexShrink:0}}>{c.icon}</div>
                <div>
                  <div style={{fontSize:13,fontWeight:700,color:active?c.text:"rgba(255,255,255,0.45)"}}>{c.label}</div>
                  <div style={{fontSize:9,color:"rgba(255,255,255,0.2)",marginTop:1,lineHeight:1.3}}>{c.desc}</div>
                </div>
              </button>
            );
          })}
        </div>
        <div style={{fontSize:11,fontWeight:700,color:"rgba(255,255,255,0.35)",marginBottom:6,letterSpacing:0.5}}>住客姓名</div>
        <input value={guest} onChange={e=>setGuest(e.target.value)} placeholder="输入住客姓名（可选）"
          style={{width:"100%",background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:10,padding:"10px 12px",color:"#fff",fontSize:14,outline:"none",marginBottom:14}}/>
        <div style={{fontSize:11,fontWeight:700,color:"rgba(255,255,255,0.35)",marginBottom:6,letterSpacing:0.5}}>备注</div>
        <textarea value={note} onChange={e=>setNote(e.target.value)} placeholder="备注（换床单、需修灯、续住天数…）" rows={2}
          style={{width:"100%",background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:10,padding:"10px 12px",color:"#fff",fontSize:13,outline:"none",resize:"none",marginBottom:14}}/>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",background:"rgba(0,191,255,0.07)",border:"1px solid rgba(0,191,255,0.2)",borderRadius:12,padding:"12px 14px",marginBottom:18}}>
          <div>
            <div style={{fontSize:13,fontWeight:700,color:"#00bfff"}}>🃏 绿色门牌已归还</div>
            <div style={{fontSize:10,color:"rgba(0,191,255,0.5)",marginTop:2}}>客人退房时交回前台</div>
          </div>
          <div onClick={()=>setCard(!card)} style={{width:46,height:26,borderRadius:13,background:card?"#007acc":"rgba(255,255,255,0.08)",position:"relative",cursor:"pointer",transition:"background 0.2s",flexShrink:0}}>
            <div style={{position:"absolute",top:3,left:card?22:3,width:20,height:20,borderRadius:"50%",background:"#fff",transition:"left 0.2s"}}/>
          </div>
        </div>
        <button onClick={doSave} style={{width:"100%",background:`linear-gradient(135deg,${STATUS[editStatus].border},${STATUS[editStatus].pill})`,border:"none",borderRadius:14,padding:"14px",fontSize:15,fontWeight:800,color:STATUS[editStatus].text,cursor:"pointer",letterSpacing:0.3}}>
          确认保存
        </button>
      </div>
    </div>
  );
}

// ─── Stats sheet ──────────────────────────────────────────────────
function StatsSheet({states,onClose}){
  const total=ALL_ROOMS.length;
  const counts={inhouse:0,extended:0,vacant:0,dirty:0,cleaning:0,clean:0,maintenance:0};
  ALL_ROOMS.forEach(r=>{ const st=states[r]?.status||"vacant"; if(counts[st]!==undefined)counts[st]++; });
  const urgentRooms=ALL_ROOMS.filter(r=>isUrgent(states[r]||{}));
  const noCard=ALL_ROOMS.filter(r=>states[r]?.cardReturned===false);
  return (
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.8)",backdropFilter:"blur(8px)",WebkitBackdropFilter:"blur(8px)",zIndex:150,display:"flex",alignItems:"flex-end"}}>
      <div onClick={e=>e.stopPropagation()} style={{width:"100%",maxWidth:480,margin:"0 auto",background:"#111118",borderRadius:"22px 22px 0 0",padding:"20px 18px 52px",border:"1px solid rgba(255,255,255,0.07)",maxHeight:"90vh",overflowY:"auto"}}>
        <div style={{width:36,height:4,background:"rgba(255,255,255,0.12)",borderRadius:2,margin:"0 auto 18px"}}/>
        <div style={{fontSize:14,fontWeight:800,color:"rgba(255,255,255,0.5)",marginBottom:14}}>今日房态汇总</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:7,marginBottom:14}}>
          {PICK_ORDER.map(k=>{
            const cfg=STATUS[k];
            return (
              <div key={k} style={{background:cfg.card,border:`1.5px solid ${cfg.border}`,borderRadius:13,padding:"12px 14px"}}>
                <div style={{fontSize:26,fontWeight:900,color:cfg.text}}>{counts[k]}</div>
                <div style={{fontSize:11,color:cfg.text,opacity:0.75,marginTop:2}}>{cfg.label}</div>
                <div style={{fontSize:9,color:cfg.text,opacity:0.38,marginTop:2}}>{Math.round((counts[k]||0)/total*100)}%</div>
              </div>
            );
          })}
        </div>
        {urgentRooms.length>0&&(
          <div style={{background:"rgba(255,68,0,0.08)",border:"1px solid rgba(255,68,0,0.3)",borderRadius:12,padding:"12px 14px",marginBottom:10}}>
            <div style={{fontSize:12,fontWeight:800,color:"#ff6622",marginBottom:6}}>⚠ 超时未打扫 ({urgentRooms.length}间)</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
              {urgentRooms.map(r=><div key={r} style={{background:"rgba(255,68,0,0.15)",color:"#ff8844",borderRadius:7,padding:"2px 8px",fontSize:11,fontWeight:700}}>{r}</div>)}
            </div>
          </div>
        )}
        {noCard.length>0&&(
          <div style={{background:"rgba(0,191,255,0.06)",border:"1px solid rgba(0,191,255,0.2)",borderRadius:12,padding:"12px 14px",marginBottom:14}}>
            <div style={{fontSize:12,fontWeight:800,color:"#00bfff",marginBottom:6}}>🃏 门牌未归还 ({noCard.length}间)</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
              {noCard.map(r=><div key={r} style={{background:"rgba(0,191,255,0.12)",color:"#00bfff",borderRadius:7,padding:"2px 8px",fontSize:11,fontWeight:700}}>{r}</div>)}
            </div>
          </div>
        )}
        <div style={{fontSize:11,fontWeight:700,color:"rgba(255,255,255,0.3)",marginBottom:8}}>按房型明细</div>
        {ROOM_CATEGORIES.map(cat=>{
          const c={};
          PICK_ORDER.forEach(k=>{c[k]=cat.rooms.filter(r=>(states[r]?.status||"vacant")===k).length;});
          return (
            <div key={cat.key} style={{marginBottom:7,padding:"9px 12px",background:"rgba(255,255,255,0.03)",borderRadius:10}}>
              <div style={{fontSize:11,color:"rgba(255,255,255,0.45)",marginBottom:5}}>{cat.label}</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                {PICK_ORDER.map(k=>c[k]>0?(
                  <span key={k} style={{background:STATUS[k].pill,color:STATUS[k].text,borderRadius:6,padding:"1px 7px",fontSize:10,fontWeight:700}}>{STATUS[k].icon} {STATUS[k].label} {c[k]}</span>
                ):null)}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── Main App ─────────────────────────────────────────────────────
function App(){
  const [states,      setStates]      = useState(loadLocal);
  const [statusFilter,setStatusFilter]= useState("all");
  const [catFilter,   setCatFilter]   = useState("all");
  const [search,      setSearch]      = useState("");
  const [selected,    setSelected]    = useState(null);
  const [showStats,   setShowStats]   = useState(false);
  const [showSearch,  setShowSearch]  = useState(false);
  const [syncStatus,  setSyncStatus]  = useState("connecting");
  const [tick,        setTick]        = useState(0);
  const mqttRef  = useRef(null);
  const statesRef = useRef(states);
  statesRef.current = states;

  // Tick for elapsed time
  useEffect(()=>{ const t=setInterval(()=>setTick(n=>n+1),60000); return()=>clearInterval(t); },[]);

  // ── MQTT setup ────────────────────────────────────────────────
  useEffect(()=>{
    if(typeof mqtt==="undefined"){ setSyncStatus("offline"); return; }

    const client = mqtt.connect(MQTT_URL, {
      clientId: CLIENT_ID,
      clean: true,
      reconnectPeriod: 5000,
      connectTimeout: 10000,
    });
    mqttRef.current = client;

    client.on("connect", ()=>{
      setSyncStatus("online");
      // Subscribe with retain — immediately receive last published state
      client.subscribe(MQTT_TOPIC, { qos:1 });
    });

    client.on("reconnect", ()=> setSyncStatus("connecting"));
    client.on("offline",   ()=> setSyncStatus("offline"));
    client.on("error",     ()=> setSyncStatus("offline"));

    client.on("message", (topic, payload)=>{
      try{
        const incoming = JSON.parse(payload.toString());
        if(!incoming || typeof incoming !== "object") return;
        // Merge: keep whichever has the newer updatedAt for each room
        setStates(prev=>{
          let changed = false;
          const next = {...prev};
          ALL_ROOMS.forEach(r=>{
            const inc = incoming[r];
            if(!inc) return;
            const cur = prev[r];
            // Accept incoming if it has a newer timestamp, or we have no data
            if(!cur || !cur.updatedAt || (inc.updatedAt && inc.updatedAt > cur.updatedAt)){
              next[r] = {...cur, ...inc};
              changed = true;
            }
          });
          if(changed){ saveLocal(next); return next; }
          return prev;
        });
      }catch(e){ console.warn("MQTT parse error",e); }
    });

    return ()=>{ try{ client.end(); }catch{} };
  },[]);

  // Publish full state (retained) so new devices get current state on connect
  const publishState = useCallback((newStates)=>{
    const client = mqttRef.current;
    if(!client || !client.connected) return;
    try{
      client.publish(MQTT_TOPIC, JSON.stringify(newStates), { qos:1, retain:true });
    }catch(e){ console.warn("MQTT publish error",e); }
  },[]);

  const cycleStatus = id => {
    setStates(prev=>{
      const cur=prev[id]?.status||"vacant";
      const next=CYCLE[(CYCLE.indexOf(cur)+1)%CYCLE.length];
      const patch={status:next,updatedAt:nowMs()};
      const updated={...prev,[id]:{...prev[id],...patch}};
      saveLocal(updated);
      publishState(updated);
      return updated;
    });
  };

  const saveRoom=(id,patch)=>{
    setStates(prev=>{
      const updated={...prev,[id]:{...prev[id],...patch}};
      saveLocal(updated);
      publishState(updated);
      return updated;
    });
  };

  // Stats
  const stats=useMemo(()=>{
    const c={inhouse:0,extended:0,vacant:0,dirty:0,cleaning:0,clean:0,maintenance:0,total:ALL_ROOMS.length,urgent:0};
    ALL_ROOMS.forEach(r=>{
      const st=states[r]?.status||"vacant";
      if(c[st]!==undefined)c[st]++;
      if(isUrgent(states[r]||{}))c.urgent++;
    });
    return c;
  },[states,tick]);

  const visCats=useMemo(()=>{
    const q=search.trim().toLowerCase();
    return ROOM_CATEGORIES.map(cat=>({
      ...cat,
      vis:cat.rooms.filter(r=>{
        const st=states[r]?.status||"vacant";
        return (statusFilter==="all"||st===statusFilter) &&
               (catFilter==="all"||cat.key===catFilter) &&
               (!q||r.toLowerCase().includes(q)||(states[r]?.guest||"").toLowerCase().includes(q));
      })
    })).filter(cat=>(catFilter==="all"||cat.key===catFilter)&&cat.vis.length>0);
  },[states,statusFilter,catFilter,search,tick]);

  const syncColor={connecting:"#ffd94d",online:"#4fffb0",offline:"#ff8080"}[syncStatus];
  const syncLabel={connecting:"连接中…",online:"实时同步",offline:"已离线"}[syncStatus];
  const today=new Date().toLocaleDateString("zh-CN",{month:"long",day:"numeric",weekday:"short"});

  const filterTabs=[
    {key:"all",label:"全部",count:stats.total},
    {key:"inhouse",label:"在住",count:stats.inhouse},
    {key:"extended",label:"续住",count:stats.extended},
    {key:"vacant",label:"空房",count:stats.vacant},
    {key:"dirty",label:"脏房",count:stats.dirty},
    {key:"cleaning",label:"打扫中",count:stats.cleaning},
    {key:"clean",label:"净房",count:stats.clean},
    {key:"maintenance",label:"维修",count:stats.maintenance},
  ];

  return (
    <div style={{background:"#09090f",minHeight:"100vh",maxWidth:480,margin:"0 auto",paddingBottom:76}}>

      {/* ── Header ── */}
      <div style={{padding:"14px 15px 0",position:"sticky",top:0,background:"#09090f",zIndex:50,borderBottom:"1px solid rgba(255,255,255,0.05)"}}>
        <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:10}}>
          {showSearch?(
            <>
              <input autoFocus value={search} onChange={e=>setSearch(e.target.value)} placeholder="搜索房间号或住客姓名…"
                style={{flex:1,background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.12)",borderRadius:10,padding:"8px 12px",color:"#fff",fontSize:13,outline:"none"}}/>
              <button onClick={()=>{setShowSearch(false);setSearch("");}} style={{background:"none",border:"none",color:"rgba(255,255,255,0.4)",fontSize:13,cursor:"pointer",padding:"0 4px"}}>取消</button>
            </>
          ):(
            <>
              <div style={{flex:1}}>
                <div style={{fontSize:17,fontWeight:900,color:"#fff",letterSpacing:-0.5}}>平措康桑 · 房态</div>
                <div style={{display:"flex",alignItems:"center",gap:5,marginTop:2}}>
                  <div style={{width:6,height:6,borderRadius:"50%",background:syncColor,flexShrink:0,
                    boxShadow:syncStatus==="online"?`0 0 5px ${syncColor}`:"none"}}/>
                  <span style={{fontSize:9,color:syncColor,fontWeight:600}}>{syncLabel}</span>
                  <span style={{fontSize:9,color:"rgba(255,255,255,0.2)",marginLeft:3}}>{today}</span>
                </div>
              </div>
              <div style={{display:"flex",gap:4,alignItems:"center"}}>
                {stats.urgent>0&&<div style={{background:"rgba(255,68,0,0.2)",border:"1px solid rgba(255,68,0,0.4)",color:"#ff6622",borderRadius:10,padding:"3px 7px",fontSize:11,fontWeight:800}}>⚠{stats.urgent}</div>}
                {[{k:"inhouse",icon:"▣"},{k:"dirty",icon:"●"},{k:"clean",icon:"✓"}].map(({k,icon})=>(
                  <div key={k} style={{background:STATUS[k].pill,color:STATUS[k].text,borderRadius:9,padding:"3px 6px",fontSize:11,fontWeight:700}}>{icon}{stats[k]}</div>
                ))}
              </div>
              <button onClick={()=>setShowSearch(true)} style={{background:"rgba(255,255,255,0.06)",border:"none",borderRadius:9,width:30,height:30,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",fontSize:14,flexShrink:0}}>🔍</button>
            </>
          )}
        </div>

        {!showSearch&&<>
          <div style={{display:"flex",gap:5,overflowX:"auto",scrollbarWidth:"none",WebkitOverflowScrolling:"touch",paddingBottom:8}}>
            {filterTabs.map(t=>{
              const active=statusFilter===t.key, cfg=t.key!=="all"?STATUS[t.key]:null;
              return (
                <button key={t.key} onClick={()=>setStatusFilter(t.key)} style={{padding:"5px 10px",borderRadius:18,flexShrink:0,cursor:"pointer",border:active?`1.5px solid ${cfg?cfg.border:"rgba(255,255,255,0.35)"}`:"1.5px solid rgba(255,255,255,0.07)",background:active?(cfg?cfg.card:"rgba(255,255,255,0.09)"):"transparent",color:active?(cfg?cfg.text:"#fff"):"rgba(255,255,255,0.32)",fontSize:12,fontWeight:active?700:400,display:"flex",alignItems:"center",gap:4}}>
                  {t.label}
                  <span style={{background:active?(cfg?cfg.pill:"rgba(255,255,255,0.15)"):"rgba(255,255,255,0.06)",borderRadius:8,padding:"0 5px",fontSize:10,fontWeight:800,color:active?(cfg?cfg.text:"#fff"):"rgba(255,255,255,0.28)"}}>{t.count}</span>
                </button>
              );
            })}
          </div>
          <div style={{display:"flex",gap:5,overflowX:"auto",scrollbarWidth:"none",WebkitOverflowScrolling:"touch",paddingBottom:11}}>
            {[{key:"all",label:"全部"},...ROOM_CATEGORIES.map(c=>({key:c.key,label:c.short}))].map(t=>{
              const active=catFilter===t.key;
              return <button key={t.key} onClick={()=>setCatFilter(t.key)} style={{padding:"4px 10px",borderRadius:14,flexShrink:0,cursor:"pointer",border:active?"1.5px solid rgba(255,255,255,0.28)":"1.5px solid rgba(255,255,255,0.06)",background:active?"rgba(255,255,255,0.09)":"transparent",color:active?"#fff":"rgba(255,255,255,0.28)",fontSize:11,fontWeight:active?700:400}}>{t.label}</button>;
            })}
          </div>
        </>}
      </div>

      {/* Legend */}
      {!showSearch&&(
        <div style={{display:"flex",gap:12,padding:"7px 15px 2px",alignItems:"center"}}>
          <div style={{display:"flex",alignItems:"center",gap:3,fontSize:10,color:"rgba(255,255,255,0.22)"}}>
            <div style={{width:6,height:6,borderRadius:"50%",background:"#00bfff"}}/>门牌未归还
          </div>
          <div style={{display:"flex",alignItems:"center",gap:3,fontSize:10,color:"rgba(255,255,255,0.22)"}}>
            <div style={{width:6,height:6,borderRadius:1,background:"#ff4400"}}/>脏房超1小时
          </div>
          <div style={{fontSize:10,color:"rgba(255,255,255,0.22)"}}>↻ 快速切换</div>
        </div>
      )}

      {/* Room list */}
      <div style={{padding:"8px 13px"}}>
        {visCats.length===0?(
          <div style={{textAlign:"center",padding:"60px 0",color:"rgba(255,255,255,0.18)",fontSize:13}}>
            <div style={{fontSize:28,marginBottom:8}}>○</div>
            {search?"没有找到匹配的房间":"暂无此状态房间"}
          </div>
        ):visCats.map(cat=>(
          <div key={cat.key} style={{marginBottom:16}}>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
              <div style={{fontSize:12,fontWeight:800,color:"rgba(255,255,255,0.5)",letterSpacing:0.3}}>{cat.label}</div>
              <div style={{flex:1,height:1,background:"rgba(255,255,255,0.05)"}}/>
              <div style={{display:"flex",gap:4,flexWrap:"wrap",justifyContent:"flex-end"}}>
                {PICK_ORDER.map(k=>{ const n=cat.rooms.filter(r=>(states[r]?.status||"vacant")===k).length; return n>0?<div key={k} style={{background:STATUS[k].pill,color:STATUS[k].text,borderRadius:7,padding:"1px 6px",fontSize:9,fontWeight:700}}>{STATUS[k].icon}{n}</div>:null; })}
              </div>
            </div>
            {cat.grid?(
              <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:5}}>
                {cat.vis.map(r=><GridCard key={r} id={r} state={states[r]||{status:"vacant"}} onCycle={cycleStatus} onPress={setSelected}/>)}
              </div>
            ):(
              <div style={{display:"flex",flexDirection:"column",gap:6}}>
                {cat.vis.map(r=><RowCard key={r} id={r} state={states[r]||{status:"vacant"}} onCycle={cycleStatus} onPress={setSelected}/>)}
              </div>
            )}
          </div>
        ))}
      </div>

      {/* Bottom nav */}
      <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:480,background:"rgba(9,9,15,0.97)",backdropFilter:"blur(12px)",WebkitBackdropFilter:"blur(12px)",borderTop:"1px solid rgba(255,255,255,0.06)",display:"flex",zIndex:100,paddingBottom:"env(safe-area-inset-bottom)"}}>
        <div style={{flex:1,padding:"10px 0 16px",display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
          <div style={{fontSize:16}}>🏠</div>
          <div style={{fontSize:9,color:"rgba(255,255,255,0.4)",fontWeight:600}}>房态</div>
        </div>
        <button onClick={()=>setShowStats(true)} style={{flex:1,padding:"10px 0 16px",background:"none",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:2,position:"relative"}}>
          {stats.urgent>0&&<div style={{position:"absolute",top:8,right:"calc(50% - 18px)",width:7,height:7,borderRadius:"50%",background:"#ff4400"}}/>}
          <div style={{fontSize:16}}>📊</div>
          <div style={{fontSize:9,color:"rgba(255,255,255,0.4)",fontWeight:600}}>汇总</div>
        </button>
      </div>

      {showStats&&<StatsSheet states={states} onClose={()=>setShowStats(false)}/>}
      {selected&&<DetailModal id={selected} state={states[selected]||{status:"vacant"}} onClose={()=>setSelected(null)} onSave={(id,p)=>{saveRoom(id,p);setSelected(null);}}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("app")).render(<App/>);
</script>
</body>
</html>
